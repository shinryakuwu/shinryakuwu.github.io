<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Rieltor.ua notifier</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			@font-face {
	 			font-family: Lucida Console;
			}

			body {
				background-color: #e6e2f2;
				background-image: url('bg.png');
				background-attachment: fixed;
				font-family: Lucida Console;
			}

			#header {
				padding: 2px 0;
				position: sticky;
  			top: 0;
			}

			#header {
				background-color: rgba(255, 255, 255, 0.8);
			}

			.marquee {
				position: relative;
				overflow: hidden;
				white-space: nowrap;
			  --offset: 20vw;
		    --move-initial: calc(-25% + var(--offset));
		    --move-final: calc(-50% + var(--offset));
			}

			.marquee_inner {
		    width: fit-content;
		    display: flex;
		    position: relative;
		    transform: translate3d(var(--move-initial), 0, 0);
		    animation: marquee 5s linear infinite;
			}

			@keyframes marquee {
		    0% {
		      transform: translate3d(var(--move-initial), 0, 0);
		    }

		    100% {
		      transform: translate3d(var(--move-final), 0, 0);
		    }
			}

			.marquee_text {
				margin-right: 100px;
			}

			#title {
				display: none;
				height: 140px;
				text-align: center;
				white-space: nowrap;
		    overflow: hidden;
				text-shadow: 5px 5px 0 #ff005e, 10px 10px 0 #00d4ff;
    		animation: shadow-dance 4s infinite;
			}

			@keyframes shadow-dance {
		    0%, 100% {
		      text-shadow: 5px 5px 0 #fff, 10px 10px 0 #eca5e3;
		    }
		    50% {
		      text-shadow: -5px -5px 0 #a5e8ec, -10px -10px 0 #fff;
		    }
			}

			#title img, #title span {
				vertical-align: middle;
			}

			#title img {
				width: 12%;
			}

			#title_text {
				font-size: 2vw;
				font-weight: bold;
				white-space: nowrap;
			}

			.mirrored {
				transform: scaleX(-1);
			}

			#main_container {
				margin: auto;
				padding: 10px;
				width: 80%;
				width: 80%;
				margin: auto;
				display: grid;
		    grid-template-columns: repeat(auto-fit, 200px);
		    grid-auto-rows: 200px;
		    gap: 10px;
		    justify-content: center;
		    align-content: start;
			}

			.item {
				background-color: rgba(255, 255, 255, 0.8);
				display: block;
				border-radius: 24px;
				padding: 18px;
			}

			.item:hover {
				background-color: rgba(192, 168, 224, 0.8);
				color: white;
			}

			.new {
				background-color: rgba(244, 210, 237, 0.8);
			}

			.cover {
				width: 100%;
				object-fit: cover;
			}

			.description {
				width: 168px;
				display: block;
				white-space: nowrap;
		    overflow: hidden;
		    text-overflow: ellipsis;
			}

			a {
				text-decoration: none;
				color: black;
			}

			/* visited link */
			a:visited {
			  color: #6048a5;
			}

			/* selected link */
			a:active {
			  color: white;
			}
		</style>
	</head>
	<body>
		<div id="header">
			<div class="marquee">
				<div class="marquee_inner" aria-hidden="true">
					<span class="marquee_text">↓ Once new listings are submitted, you'll see them here in real time. ↓</span>
					<span class="marquee_text">↓ Once new listings are submitted, you'll see them here in real time. ↓</span>
					<span class="marquee_text">↓ Once new listings are submitted, you'll see them here in real time. ↓</span>
					<span class="marquee_text">↓ Once new listings are submitted, you'll see them here in real time. ↓</span>
				</div>
			</div>
		</div>
		<div id="title">
			<img src="dance.gif" class="mirrored">
			<span id="title_text">=( o w o )=</span>
			<img src="dance.gif">
		</div>
		<div id="main_container"></div>
		<script type="text/javascript">

			// ↓↓ You can alter this value, but there's a high risk for rieltor.ua to throw a captcha ↓↓
			// (this script doesn't solve captchas)
			let refetch_delay = 5 * 60 * 1000; // refetch every 5 minutes

			const source_url = prompt("This website will monitor apartment listings for you and update in real time whenever new ones appear.\nEnter your rieltor.ua search prompt URL.\nFor example: https://rieltor.ua/flats-rent/%D0%A2%D1%80%D0%BE%D1%94%D1%89%D0%B8%D0%BD%D0%B0-o138/")

			const notification_sound = new Audio("meow.wav");
			const parced_url = new URL(source_url);
			const listing_ids = new Set();
			let max_pages = 1;
			let changed = false;
			let title;

			fetchListings(true);

			setInterval(() => {
			  fetchListings(false);
			}, refetch_delay);

			async function fetchListings(initial) {
				console.log("fetch initiated");
		    changed = false;

		    for (let page = 1; page <= max_pages; page++) {
	    		console.log("fetching page" + page);

	        parced_url.searchParams.set("page", page);

	        let response = await fetch(parced_url);
	        let html = await response.text();
	        let doc = new DOMParser().parseFromString(html, "text/html");

	        let listings = doc.getElementsByClassName("catalog-card");
	        addListingItems(listings, initial);

	        if (page === 1) {
	          defineMaxPages(doc);
	          if (initial) { addTitle(doc); }
	        }

	        await sleep(Math.random() * (3000 - 2000) + 2000); // i'm a human i swear
		    }

		    if (!initial && changed) { notify(); }

		    console.log("fetch done");
			}

			function sleep(ms) {
			  return new Promise(resolve => setTimeout(resolve, ms));
			}

			function defineMaxPages(doc) {
				let counter = doc.querySelector("[data-listing-count]");
				let listings_count = Number(counter.textContent.match(/\d+/)[0]);
				if (listings_count < 1) { return; }

				max_pages = Math.floor(listings_count / 20);
				if (listings_count % 20 > 0 || max_pages == 0) {
					max_pages++;
				}
			}

			function addListingItems(listings, initial) {
				for (var i = 0; i < listings.length; i++) {
					let id = listings[i].dataset.catalogItemId

					if (!listing_ids.has(id)) {
						let item = document.createElement("a");
						item.className = "item";
						item.href = listings[i].firstElementChild.href;

						let cover = document.createElement("img");
						cover.src = listings[i].getElementsByClassName("offer-photo-slider-slide-image")[0]?.src;
						cover.className = "cover";

						let description = document.createElement("div");
						description.className = "description";
						let price = listings[i]?.dataset?.label;
						let address = listings[i].getElementsByClassName("catalog-card-address")[0]?.innerHTML;
						description.innerHTML = "<b>" + price + "</b><br>" + address;

						let container = document.getElementById("main_container");
						item.appendChild(cover);
						item.appendChild(description);

						if (initial) {
							container.appendChild(item);
						} else {
							item.className += " new";
							container.prepend(item);
						}

						listing_ids.add(id);
						changed = true;

						if (!initial) { console.log("new listing found"); }
					}
				}
			}

			function addTitle(doc) {
				let title = doc.getElementsByClassName("catalog-header__title")[0]?.innerText.trim();
				if (!title) { return; }

				if (listing_ids.size > 0) {
					displayTitleBlock();
				}

				let title_text = document.getElementById("title_text");
				title_text.innerHTML = title;
			}

			function displayTitleBlock() {
				let title_block = document.getElementById("title");
				title_block.style.display = "block";
			}

			function notify() {
				notification_sound.currentTime = 0;
				notification_sound.play();
			}
		</script>
	</body>
</html>
