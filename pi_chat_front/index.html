<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>JINE</title>
		<style type="text/css">
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			@font-face {
	 			font-family: PixelMplus10;
	 			src: url(assets/PixelMplus10-Regular.ttf);
			}

			@font-face {
	 			font-family: PixelMplus12;
	 			src: url(assets/PixelMplus12-Regular.ttf);
			}

			html, body {
				height: 100%;
			}

			input, textarea {
			  background: none;
			  border: none;
			}

			textarea {
				resize: none;
			}

			textarea:focus, input:focus{
			  outline: none;
			}

			#left_side_panel, #right_side_panel {
				background-image: url('assets/side_panel_day.png');
				background-size: cover;
				height: 100%;
				width: 242px;
				display: inline-block;
			}

			#right_side_panel {
				transform: scaleX(-1);
			}

			body {
				display: flex;
				justify-content: space-between;
				color: #4d23cd;
			}

			#main {
				background-image: url('assets/wallpaper.png');
				display: inline-block;
				width: calc(100% - (2 * 242px));
				height: 100%;
			}

			#icon_container {
				text-align: center;
				width: 66px;
				margin: 72px;
				cursor: pointer;
			}

			#icon_text {
				font-family: PixelMplus10;
				font-size: 20px;
			}

			#window {
				width: calc(100% - (2 * 242px));
				height: 100%;
				border: 2px solid #4d23cd;
				background-color: #90f3e1;
				position: absolute;
			}

			#window_header {
				font-family: PixelMplus10;
				font-size: 20px;
				background-color: #efcfef;
				border: 2px solid #4d23cd;
				margin: 4px;
				padding: 4px;
				line-height: 0;
				position: relative;
			}

			#window_header_square {
				width: 18px;
				height: 18px;
				background-color: #4d23cd;
				display: inline-block;
			}

			#window_header_text {
				position: relative;
				bottom: 2px;
				left: 4px;
			}

			#window_header_cross {
				position: absolute;
				cursor: pointer;
				right: 3px;
				top: 3px;
			}

			#window_footer {
				position: relative;
				height: 16px;
			}

			#window_footer_big_block {
				width: 36px;
				height: 9px;
				background-color: #ea9fe7;
				border: 2px solid #4d23cd;
				border-bottom: none;
				margin-left: 4px;
				position: absolute;
				bottom: 0;
			}

			.window_footer_small_block {
				width: 6px;
				height: 6px;
				border: 2px solid #4d23cd;
				margin-bottom: 2px;
				position: absolute;
				bottom: 0;
			}

			#footer_block1 {
				left: 42px;
			}

			#footer_block2 {
				left: 50px;
			}

			#footer_block3 {
				left: 58px;
			}

			#window_content {
				height: calc(100% - 34px - 20px);
				margin: 0 4px;
				border: 2px solid #4d23cd;
				display: flex;
				font-family: PixelMplus12;
				overflow: hidden;
			}

			#nav {
				width: 30%;
				background-color: #fcf0fd;
				min-width: 192px;
			}

			#nav_header {
				background-color: #f6e0f8;
				padding: 10px;
				display: flex;
			}

			#profile_picture_small {
				display: block;
				width: 50px;
				height: 50px;
				object-fit: cover;
			}

			#search {
				display: inline-block;
				background-color: #ccecfc;
				margin-left: 10px;
				width: calc(100% - 50px - 10px);
				border-radius: 10px;
				padding: 7px 10px;
			}

			#chat {
				background-image: url('assets/chat_bg.png');
				width: 70%;
				height: 100%;
				position: relative;
				min-width: 224px;
			}

			#chat_input_panel {
				position: absolute;
				bottom: 0;
				background-color: rgba(71, 106, 255, 0.18);
				width: 100%;
				height: 272px;
				padding: 12px;
				display: flex;
				justify-content: space-between;
			}

			.message_type_tab {
				display: none;
			}

			.message_type_tab.active {
				display: block;
			}

			#chat_text_tab {
				background-color: rgba(255, 255, 255, 0.7);
				border-radius: 10px;
			}

			#chat_text_tab, #chat_stickers_tab, #paint_tab {
				padding: 14px;
				width: calc(100% - 74px - 12px);
			}

			#message_input, #search_input {
				width: 100%;
				height: 100%;
				font-family: PixelMplus12;
			  color: #4d23cd;
			  font-size: 24px;
			}

			.chat_button {
				width: 74px;
				height: 62px;
				background-color: #f6e0f8;
				border-top: 2px solid #fcf1fc;
				border-left: 2px solid #fcf1fc;
				border-right: 2px solid #815cda;
				border-bottom: 2px solid #815cda;
				display: flex;
				justify-content: center;
				align-items: center;
				cursor: pointer;
			}

			.chat_button:hover {
				background-color: #efa3fc;
			}

			.chat_button img.active {
				display: none;
			}

			.chat_button.active img.inactive {
				display: none;
			}

			.chat_button.active img.active {
				display: flex;
			}

			.chat_button.active {
				background-color: #4d23cd;
				border: none;
			}

			.nav_item {
				width: 100%;
				display: flex;
				padding: 6px;
				cursor: pointer;
			}

			.nav_item_name, .nav_item_message {
				font-size: 24px;
				white-space: nowrap;
		    overflow: hidden;
		    text-overflow: ellipsis;
			}

			.nav_item_message, .nav_item_name {
				width: calc(100% - 42px);
			}

			.nav_item_message, .nav_item_time {
				color: #816bda;
			}

			.nav_item_time, .nav_item_count {
				font-family: PixelMplus10;
/*				font-size: 20px;*/
			}

			.nav_item:hover {
				color: white;
				background-color: #4d23cd;
			}

			.nav_item:hover .nav_item_message, .nav_item:hover .nav_item_time {
				color: white;
			}

			.nav_item_picture, .profile_picture {
				width: 50px;
				height: 50px;
				border-radius: 50%;
				object-fit: cover;
				flex-shrink: 0;
			}

			.nav_item_text {
				padding-left: 6px;
				width: calc(100% - 50px);
				position: relative;
			}

			.nav_item_time, .nav_item_count {
				display: block;
				position: absolute;
				right: 2px;
			}

			.nav_item_count {
				background-color: #fc5aa0;
				border-radius: 12px;
				text-align: center;
				color: white;
				padding: 1px 7px 1px 9px;
			}

			#nav {
				overflow: auto;
    		overflow-x: hidden;
			}

			#chat_stickers_tab {
				width: 100%;
				height: 100%;
				overflow: auto;
    		overflow-x: hidden;
			}

			#chat_stickers_content {
				width: 100%;
				display: grid;
		    grid-template-columns: repeat(auto-fit, 100px);
		    grid-auto-rows: 100px;
		    gap: 10px;
		    justify-content: center;
		    align-content: start;
			}

			.sticker {
				cursor: pointer;
				opacity: 0.5;
			}

			.sticker:hover {
				opacity: 1;
			}

			.sticker img {
				height: 100%;
				object-fit: cover;
			}

			#chat_container {
				width: 100%;
				padding: 16px;
				height: calc(100% - 272px);
				overflow: auto;
			}

			#chat_content {
				width: 100%;
				display: flex;
    		flex-direction: column;
    		gap: 10px;
			}

			.message {
		    position: relative;
		    display: flex;
		    align-items: flex-end;
		    gap: 8px;
		    max-width: 100%;
			}

			.message.text_message .bubble {
				position: relative;
				max-width: 70%;
		    padding: 4px 14px;
		    border-radius: 10px;
		    line-height: 1.4;
		    font-family: PixelMplus12;
				font-size: 24px;
			}

			.received {
		    align-self: flex-start;
			}

			.message .profile_picture {
				align-self: flex-start;
			}

			.received.text_message .bubble {
				background: #cce4fc;
			}

			.received.text_message .bubble::before {
		    content: "";
		    position: absolute;
		    top: 10px;
		    left: -8px;
		    width: 3px;
		    height: 0;
		    border-top: 8px solid #cce4fc;
		    border-left: 8px solid transparent;
		    transform: rotate(15deg);
			}

			.sent {
/*		    align-self: flex-end;*/
		    justify-content: flex-end;
			}

			.sent.text_message .bubble {
				background: #4aee53;
			}

			.sent.text_message .bubble::after {
		    content: "";
		    position: absolute;
		    top: 10px;
		    right: -8px;
		    width: 3px;
		    height: 0;
		    border-top: 8px solid #4aee53;
		    border-right: 8px solid transparent;
		    transform: rotate(-15deg);
			}

			.sticker_message .chat_sticker {
				height: 100px;
				width: 100px;
				object-fit: cover;
			}

			.message_actions {
				color: white;
				display: flex;
		    align-items: center;
		    gap: 6px;
		    white-space: nowrap;
			}

			.message_actions .time, .message_actions .reply {
				opacity: 0;
    		transition: opacity 0.15s;
			}

			.message:hover .message_actions .time, .message:hover .message_actions .reply {
			  opacity: 1;
			}

			.reply {
		    cursor: pointer;
			}

			.reply:hover {
			  color: #4d23cd;
			}

			.read {
				font-family: PixelMplus10;
			}

		</style>
	</head>
	<body>
		<div id="left_side_panel">
		</div>
		<div id="main">
			<div id="window">
				<div id="window_header">
					<img id="window_header_cross" src="assets/window_cross.png">
					<div id="window_header_square"></div><span id="window_header_text">JINE</span>
				</div>
				<div id="window_content">
					<div id="nav">
						<div id="nav_header">
							<img id="profile_picture_small" src="assets/pp_small.png">
							<div id="search">
								<input id="search_input" placeholder="Search" type="text">
							</div>
						</div>
						<div id="nav_content">
							<div class="nav_item">
								<img class="nav_item_picture" src="assets/pp1.png">
								<div class="nav_item_text">
									<div class="nav_item_time">01:01</div>
									<div class="nav_item_name">Ameeeee</div>
									<div class="nav_item_count">99+</div>
									<div class="nav_item_message">I don't know anymore.</div>
								</div>
							</div>
						</div>
					</div>
					<div id="chat">
						<div id="chat_container">
							<div id="chat_content">
								<div class="message received text_message">
							    <img class="profile_picture" src="assets/pp1.png">
							    <div class="bubble">
						        hi!
							    </div>
							    <div class="message_actions">
						        <span class="time">14:32</span>
						        <span class="reply">↩</span>
							    </div>
								</div>
								<div class="message sent text_message">
									<div class="message_actions">
										<span class="reply">↩</span>
						        <span class="time">14:33</span>
						        <span class="read">Read</span>
							    </div>
							    <div class="bubble">
						        Hello! 😊
				          	How are you?
							    </div>
								</div>
								<div class="message received text_message">
							    <img class="profile_picture" src="assets/pp1.png">
							    <div class="bubble">
						        i don't know anymore
							    </div>
							    <div class="message_actions">
						        <span class="time">14:34</span>
						        <span class="reply">↩</span>
							    </div>
								</div>
				        <div class="message sent sticker_message">
				        	<div class="message_actions">
				        		<span class="reply">↩</span>
						        <span class="time">14:34</span>
						        <span class="read">Read</span>
							    </div>
				          <img class="chat_sticker" src="assets/stickers/sad.png">
				        </div>
				        <div class="message received sticker_message">
				        	<img class="profile_picture" src="assets/pp1.png">
				          <img class="chat_sticker" src="assets/stickers/ded.png">
				          <div class="message_actions">
						        <span class="time">14:34</span>
						        <span class="reply">↩</span>
							    </div>
				        </div>
					    </div>
						</div>
						<div id="chat_input_panel">
							<div id="chat_text_tab" class="message_type_tab active">
								<textarea id="message_input"></textarea>
							</div>
							<div id="chat_paint_tab" class="message_type_tab">
								Tab under maintenance
							</div>
							<div id="chat_stickers_tab" class="message_type_tab">
								<div id="chat_stickers_content">
									<div class="sticker">
										<img src="assets/stickers/ok.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/omg.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/sad.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/idc.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/sorry.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/ded.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/love.png">
									</div>
									<div class="sticker">
										<img src="assets/stickers/this.png">
									</div>
								</div>
							</div>
							<div id="chat_button_panel">
								<div class="chat_button message_type_button active" id="text_button">
									<img class="inactive" src="assets/text_icon.png">
									<img class="active" src="assets/text_icon_active.png">
								</div>
								<div class="chat_button message_type_button" id="paint_button">
									<img class="inactive" src="assets/paint_icon.png">
									<img class="active" src="assets/paint_icon_active.png">
								</div>
								<div class="chat_button message_type_button" id="stickers_button">
									<img class="inactive" src="assets/sticker_icon.png">
									<img class="active" src="assets/sticker_icon_active.png">

								<div class="chat_button" id="send_button">

				</div>
				<div id="window_footer">
					<div id="window_footer_big_block"></div><div class="window_footer_small_block" id="footer_block1"></div><div class="window_footer_small_block" id="footer_block2"></div><div class="window_footer_small_block" id="footer_block3"></div>
				</div>
			</div>
			<div id="icon_container">
				<img src="assets/jine_icon.png">
				<div id="icon_text">Jine</div>
			</div>
		</div>
		<div id="right_side_panel">
		</div>
		<script type="text/javascript">
			(function disableImageDrag() {
				document.addEventListener('dragstart', function (event) {
					if (event.target.tagName === 'IMG') {
							event.preventDefault();
					}
				});
			})();

			document.getElementById("window_header_cross").addEventListener("click", closeWindow);
			document.getElementById("icon_container").addEventListener("click", openWindow);

			document.getElementById("send_button").addEventListener("click", sendMessage);
			document.querySelectorAll(".sticker").forEach((sticker) => sticker.addEventListener("click", sendMessage));

			document.querySelectorAll(".message_type_button").forEach((button) => button.addEventListener("click", switchMessageTypeTab));

			function closeWindow() {
				document.getElementById("window").style.display = "none";
			}

			function openWindow() {
				document.getElementById("window").style.display = "block";
			}

			function switchMessageTypeTab(event) {
				let pressed_button = event.currentTarget;
				if (pressed_button.classList.contains("active")) { return; }

				disableElementsByClassname(".message_type_button");
				disableElementsByClassname(".message_type_tab");

				pressed_button.classList.add("active");

				document.getElementById("chat_" + pressed_button.id.replace("button", "tab")).className += " active";
			}

			function disableElementsByClassname(classname) {
				document.querySelectorAll(classname).forEach(
					element => element.classList.remove("active")
				);
			}

			function sendMessage(event) {
		    let new_message;

		    if (document.getElementById("text_button").classList.contains("active")) {
	        new_message = newTextMessage();
		    } else if (event.currentTarget.classList.contains("sticker")) {
	        new_message = newStickerMessage(event);
		    }

		    if (!new_message) { return; }

		    let chat = document.getElementById("chat_content");
		    chat.appendChild(new_message);

		    let chat_container = document.getElementById("chat_container");
		    chat_container.scrollTop = chat_container.scrollHeight; // scroll to the bottom of the chat
			}

			function newTextMessage() {
		    let input = document.getElementById("message_input");
		    if (input.value.trim() === "") { return; }

		    let new_message = document.createElement("div");
		    new_message.className = "message sent text_message";

		    let actions = document.createElement("div");
		    actions.className = "message_actions";
		    actions.innerHTML = `
	        <span class="reply">↩</span>
	        <span class="time">14:35</span>
	        <span class="read">Read</span>
		    `;

		    let bubble = document.createElement("div");
		    bubble.className = "bubble";
		    bubble.textContent = input.value;

		    new_message.appendChild(createMessageActions());
		    new_message.appendChild(bubble);

		    input.value = "";

		    return new_message;
			}

			function newStickerMessage(event) {
		    let sticker = event.currentTarget.children[0];

		    let new_message = document.createElement("div");
		    new_message.className = "message sent sticker_message";

		    let actions = document.createElement("div");
		    actions.className = "message_actions";
		    actions.innerHTML = `
	        <span class="reply">↩</span>
	        <span class="time">14:35</span>
	        <span class="read">Read</span>
		    `;

		    let img = document.createElement("img");
		    img.className = "chat_sticker";
		    img.src = sticker.src;

		    new_message.appendChild(createMessageActions());
		    new_message.appendChild(img);

		    return new_message;
			}

			function createMessageActions() {
				function checkTime(i) {
		      return (i < 10) ? "0" + i : i;
		    }

				let now = new Date();
        let time = checkTime(now.getHours()) + ":" + checkTime(now.getMinutes());

		    let actions = document.createElement("div");
		    actions.className = "message_actions";

		    actions.innerHTML = `
	        <span class="reply">↩</span>
	        <span class="time">` + time + `</span>
	        <span class="read">Read</span>
		    `;

		    return actions;
			}
		</script>
	</body>
</html>
